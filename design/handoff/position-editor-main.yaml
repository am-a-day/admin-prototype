responsive:
  viewportExamples:
    - viewport: ">=1400px"
      sidePeekWidth: 470
    - viewport: "<1400px"
      sidePeekWidth: 400
  container:
    defaultWidths:
      compact: 400
      wide: 470
    resizeRange:
      min: 380
      max: 600
    visibleTableMin: 120
    headerHeight: 56
    behavior: overlays-catalog-with-left-border-no-shadow

componentMap:
  - figmaComponent: Button
    codePeer: Button
    sourcePath: src/components/ui/button.tsx
    status: mapped
    codeVariants:
      variant: [default, destructive, secondary, outline, ghost]
      size: [default, sm, lg, icon]
    figmaProperties: [variant, size, label]
    notes: destructive source token is undefined in the current theme; disabled, hover, and focus remain CSS interaction states rather than invented Figma axes
  - figmaComponent: Input
    codePeer: Input
    sourcePath: src/components/ui/input.tsx
    status: mapped
    codeVariants:
      size: [default, compact]
    figmaProperties: [size, value]
    notes: native input type, disabled, and focus ring are behavior-only
  - figmaComponent: Tooltip
    codePeer: Tooltip
    sourcePath: src/components/ui/tooltip.tsx
    status: mapped
    codeVariants:
      side: [right, left, top, bottom]
      disabled: [true, false]
    figmaProperties: [side, content]
    notes: default delayDuration is 300ms and sideOffset is 6px
  - figmaComponent: PositionEditorDialogShell
    codePeer: PositionEditorDialogShell
    sourcePath: src/features/storefront/catalog-workspace.tsx
    status: mapped
    codeVariants:
      presentation: [dialog, pane]
      creation: [true, false]
    figmaProperties: [presentation]
    notes: pane samples 400px and 470px; 380-600px range belongs in description
  - figmaComponent: SidePeekHeader
    codePeer: none
    sourcePath: inline header inside PositionEditor
    status: candidate-extraction
    codeVariants: {}
    figmaProperties: [state]
    notes: compose nested PositionSaveStatus and PositionQueueControls; header navigation is hover/focus-only
  - figmaComponent: PositionSaveStatus
    codePeer: PositionSaveStatus
    sourcePath: src/features/storefront/catalog/editor/position-editor.tsx
    status: mapped
    codeVariants:
      state: [idle, saving, saved, error]
    figmaProperties: [state]
    notes: error renderer exists but is currently unreachable and spec-only
  - figmaComponent: WorkspaceLocalTabs
    codePeer: WorkspaceLocalTabs
    sourcePath: src/features/storefront/catalog/editor/editor-tabs.tsx
    status: mapped
    codeVariants:
      active: [true, false]
      count: [true, false]
      endAction: [optional]
    figmaProperties: [state]
    notes: endAction exists as an optional ReactNode
  - figmaComponent: PositionQueueControls
    codePeer: PositionQueueControls
    sourcePath: src/features/storefront/catalog/editor/editor-queue-controls.tsx
    status: mapped
    codeVariants:
      previousId: [available, unavailable]
      nextId: [available, unavailable]
    figmaProperties: [state]
    notes: show all four enabled-disabled combinations
  - figmaComponent: TranslatableField
    codePeer: TranslatableField
    sourcePath: src/components/workspace/translatable-field.tsx
    status: mapped
    codeVariants:
      multiline: [true, false]
      compact: [true, false]
      plain: [true, false]
    figmaProperties: [presentation, density, state]
    notes: no separate translation model may be invented

states:
  - id: default-editing
    implemented: true
    source: PositionEditor mode=edit
    handoffStatus: mapped
    notes: active edit state
  - id: saving
    implemented: true
    source: PositionSaveStatus status=saving
    handoffStatus: mapped
    notes: simulated autosave
  - id: saved
    implemented: true
    source: PositionSaveStatus status=saved
    handoffStatus: mapped
    notes: success icon and copy
  - id: error
    implemented: false
    source: PositionSaveStatus renderer
    handoffStatus: spec-only
    notes: renderer exists; current prototype never reaches it; not Ready for dev
  - id: long-title
    implemented: true
    source: PositionEditor detail-pane header
    handoffStatus: mapped
    notes: title truncates
  - id: navigation-visible
    implemented: true
    source: PositionEditor detail-pane controls
    handoffStatus: mapped
    notes: hover/focus-only visibility

